name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (csc from .NET Framework)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build.ps1 -Clean -Strict

      - name: Self test
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\run-tests.ps1

      - name: Show build info
        shell: powershell
        run: Get-Content .\bin\build-info.txt

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: WirelessBattery-win64
          path: |
            bin/WirelessBattery.exe
            bin/无线设备电量.exe
            bin/build-info.txt
          if-no-files-found: error
