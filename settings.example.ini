# WirelessBattery settings（示例）
# 首次运行会在 exe 同目录自动生成 settings.ini；本文件仅作字段说明，不会被程序读取。
# 格式：一行一个 key=value，以 # 开头为注释。程序写入为原子写（先 .tmp 再替换）。

# ---- 全局 ----
Interval=60
CloseToTray=1
AutoStartWanted=1

# ---- 每个型号一行组（键为“型号级”标识：MCHOSE / K02BS / 046D:C539 / BT:设备名）----
Device.MCHOSE.Enabled=1
Device.MCHOSE.Seen=1
Device.MCHOSE.ShowCard=1
Device.MCHOSE.ShowTray=1
Device.MCHOSE.Order=0
# 可选：Device.<键>.Name=自定义显示名（≤32 字，空即用默认名）

# ---- 蓝牙阶梯估算（Enabled / 满电小时 / 阶梯 / 五段权重）----
Estimate.K02BS.Enabled=1
Estimate.K02BS.Hours=163
Estimate.K02BS.Stages=100,80,60,40,20,0
Estimate.K02BS.Weights=8,40,40,8,4

# ---- 罗技电压校准（全局一份）----
Gpw.FullMv=4200
Gpw.EmptyMv=3300
Gpw.MidOffset=0
Gpw.MedianWindow=3
Gpw.Alpha=0.25
Gpw.Hysteresis=2
Gpw.Rise=50
Gpw.AutoAdjust=0

# ---- 运行时状态（Runtime.* / Probe.*）由程序自动维护，无需手写 ----
